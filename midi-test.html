<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử MIDI</title>
<style>
  :root { --paper:#f4efe6; --ink:#2b2622; --muted:#7a7066; --accent:#a0522d; --line:#d9cfc1; }
  body { background:var(--paper); color:var(--ink); font:17px/1.6 Georgia, "Times New Roman", serif; margin:0; padding:24px 16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-weight:normal; font-size:28px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  #status { margin:16px 0; padding:12px 14px; border:1px solid var(--line); border-radius:6px; }
  .ok { color:#3d6b3d; } .bad { color:var(--accent); }
  #kb { position:relative; height:120px; margin:20px 0; user-select:none; }
  .w { position:absolute; top:0; height:120px; border:1px solid var(--ink); background:#fffdf8; box-sizing:border-box; }
  .b { position:absolute; top:0; height:75px; background:var(--ink); z-index:2; }
  .w, .b { transition: background .5s; }
  .w.on { background:#e07a3f !important; transition:none; } .b.on { background:#e07a3f !important; transition:none; }
  #big { font-size:64px; text-align:center; min-height:80px; color:var(--accent); }
  #log { font:14px/1.5 ui-monospace, Menlo, monospace; max-height:240px; overflow:auto; border-top:1px solid var(--line); padding-top:8px; }
  button { font:inherit; padding:8px 16px; border:1px solid var(--ink); background:transparent; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Thử nối đàn</h1>
  <p class="muted">Bật Bluetooth MIDI trên ES110, ghép trong Audio MIDI Setup, rồi bấm nút dưới đây. Đánh vài phím — phím sáng lên là nối được.</p>
  <button id="go">Kết nối đàn</button>
  <div id="status" class="muted">Chưa kết nối.</div>
  <div id="big"></div>
  <div id="kb"></div>
  <div id="log"></div>
</main>
<script>
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LOW = 21, HIGH = 108; // đủ 88 phím A0..C8
const kb = document.getElementById('kb'), keys = {};
(function drawKeyboard(){
  const whites = [];
  for (let n = LOW; n <= HIGH; n++) if (!NAMES[n%12].includes('#')) whites.push(n);
  const ww = 100 / whites.length;
  whites.forEach((n,i) => { const d = document.createElement('div'); d.className='w'; d.style.left=(i*ww)+'%'; d.style.width=ww+'%'; kb.appendChild(d); keys[n]=d; });
  for (let n = LOW; n <= HIGH; n++) if (NAMES[n%12].includes('#')) {
    const i = whites.indexOf(n-1); const d = document.createElement('div'); d.className='b';
    d.style.left=((i+1)*ww - ww*0.3)+'%'; d.style.width=(ww*0.6)+'%'; kb.appendChild(d); keys[n]=d;
  }
})();
const status = document.getElementById('status'), log = document.getElementById('log');
let t0 = null;
function say(msg, cls){ status.textContent = msg; status.className = cls || 'muted'; }
function line(s){ const p = document.createElement('div'); p.textContent = s; log.prepend(p); }
function onMsg(e){
  const [cmd, note, vel] = e.data, type = cmd & 0xf0;
  const name = NAMES[note%12] + (Math.floor(note/12)-1);
  if (type === 0x90 && vel > 0) {
    if (t0 === null) t0 = e.timeStamp;
    keys[note]?.classList.add('on');
    document.getElementById('big').textContent = name;
    line(`${((e.timeStamp - t0)/1000).toFixed(3)}s  bấm ${name}  lực ${vel}`);
  } else if (type === 0x80 || (type === 0x90 && vel === 0)) {
    const k = keys[note]; if (k) setTimeout(() => k.classList.remove('on'), 300);
  } else if (type === 0xb0 && note === 64) {
    line(`pedal ${vel >= 64 ? 'đạp' : 'nhả'}`);
  }
}
function bind(access){
  const ins = [...access.inputs.values()];
  if (!ins.length) { say('Chrome chưa thấy đàn nào. Kiểm tra lại ghép Bluetooth trong Audio MIDI Setup.', 'bad'); return; }
  ins.forEach(i => i.onmidimessage = onMsg);
  say('Đã thấy: ' + ins.map(i => i.name).join(', ') + '. Đánh thử vài phím nhé.', 'ok');
}
document.getElementById('go').onclick = async () => {
  if (!navigator.requestMIDIAccess) { say('Trình duyệt này không hỗ trợ Web MIDI. Dùng Chrome nhé.', 'bad'); return; }
  try {
    const access = await navigator.requestMIDIAccess();
    bind(access);
    access.onstatechange = () => bind(access);
  } catch (err) { say('Không xin được quyền MIDI: ' + err.message, 'bad'); }
};
</script>
</body>
</html>
